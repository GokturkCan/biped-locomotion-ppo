ppo:
  profile: u13
  num_envs: 1024
  unroll_length: 20
  batch_size: 128
  num_minibatches: 16
  num_updates_per_batch: 4
  learning_rate: 0.0002
  discounting: 0.97
  gae_lambda: 0.95
  entropy_cost: 0.01
  clipping_epsilon: 0.2
  episode_length: 1000
  num_evals: 21
  num_timesteps: 20480000
  normalize_observations: true
  max_grad_norm: 1.0
  num_resets_per_eval: 0
  num_eval_envs: 128
  action_repeat: 1
  reward_scaling: 1.0
  log_training_metrics: true
